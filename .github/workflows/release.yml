name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid semver (expected vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing natrium-core@$version"

      # Builds every artifact the release consists of before anything is uploaded, so a broken
      # release fails here instead of half-way through publishing. compileCommonMainKotlinMetadata
      # matters in particular: it only runs when publishing, so a plain platform build never
      # exercises it, and publishAndReleaseToMavenCentral reaches it only after it has already
      # created the Maven Central staging repository and uploaded the Android artifacts.
      - name: Verify natrium-core builds before publishing
        run: |
          ./gradlew :natrium-core:compileCommonMainKotlinMetadata :natrium-core:assemble \
            -Pversion=${{ steps.version.outputs.value }} \
            --no-configuration-cache --stacktrace

      - name: Publish natrium-core to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        run: |
          ./gradlew :natrium-core:publishAndReleaseToMavenCentral \
            -Pversion=${{ steps.version.outputs.value }} \
            --no-configuration-cache --stacktrace
